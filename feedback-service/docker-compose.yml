services:
  feedback-api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: feedback_api_container
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - feedback-network

  mysql:
    image: mysql:8.0
    container_name: feedback_mysql_db
    environment:
      # These must match the variables in your .env file
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - feedback-network

volumes:
  mysql_data:

networks:
  feedback-network:
    driver: bridge